<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; color: #333; }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
    header { background: #1a1a2e; color: #fff; padding: 20px 0; }
    header h1 { font-size: 1.8em; }
    header h1 a { color: #e94560; text-decoration: none; }
    nav { margin-top: 15px; }
    nav a { color: #fff; text-decoration: none; margin-right: 20px; padding: 5px 10px; border-radius: 4px; }
    nav a:hover { background: #e94560; }
    nav a.active { background: #e94560; }
    main { padding: 40px 0; min-height: calc(100vh - 200px); }
    footer { background: #1a1a2e; color: #fff; text-align: center; padding: 20px 0; margin-top: 60px; }
    .content { max-width: 800px; margin: 0 auto; }
    h1, h2, h3 { color: #1a1a2e; margin: 1.5em 0 0.8em; }
    h1 { font-size: 2em; }
    h2 { font-size: 1.5em; border-bottom: 2px solid #e94560; padding-bottom: 10px; }
    a { color: #e94560; }
    .breadcrumb { margin-bottom: 20px; font-size: 0.9em; color: #666; }
    .breadcrumb a { color: #666; }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1><a href="{{ site.baseurl }}/">{{ site.title }}</a></h1>
      <nav>
        {% for item in site.navigation %}
          <a href="{{ item.url }}">{{ item.title }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="content">
        {{ content }}
      </div>
    </div>
  </main>

  <footer>
    <p>黑神话悟空攻略站 · 仅供学习交流</p>
  </footer>
</body>
</html>
